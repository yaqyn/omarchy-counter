<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Counter — a quiet tally counter for Omarchy</title>
  <desc id="desc">A large count of 33 connected to an F1 key, beside the Counter name. Azkar, repetitions and everyday tallies.</desc>
  <metadata>Copyright 2026 Abdulrahman M. Yaqyn. Original vector artwork.</metadata>
  <rect width="1280" height="560" rx="20" fill="#101922"/>
  <g font-family="DejaVu Sans, sans-serif">
    <path d="M80 84h50" stroke="#a8cbd7" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="225" fill="#edf3f7" font-size="94" font-weight="600" letter-spacing="-4">Counter</text>
    <text x="84" y="285" fill="#a8cbd7" font-size="28">A quiet tally counter for Omarchy.</text>
    <text x="84" y="345" fill="#899da8" font-size="20">Azkar · repetitions · everyday tallies</text>
    <path d="M80 458h1120" stroke="#263a46" stroke-width="1.5"/>
    <text x="84" y="501" fill="#899da8" font-size="17">One key. One count. Keep your focus.</text>
    <g transform="translate(802 74)">
      <rect x="16" y="16" width="370" height="270" rx="24" fill="#14222c" stroke="#263a46" stroke-width="2"/>
      <text x="48" y="63" fill="#899da8" font-size="18">Count</text>
      <text x="201" y="222" text-anchor="middle" fill="#edf3f7" font-family="DejaVu Sans Mono, monospace" font-size="156" letter-spacing="-9">33</text>
      <path d="M201 288v36" stroke="#a8cbd7" stroke-width="2"/>
      <rect x="118" y="324" width="166" height="70" rx="13" fill="#1e3440" stroke="#a8cbd7" stroke-width="1.5"/>
      <path d="M134 381h134" stroke="#45616f" stroke-width="1.5"/>
      <text x="201" y="370" text-anchor="middle" fill="#edf3f7" font-family="DejaVu Sans Mono, monospace" font-size="32">F1</text>
      <circle cx="363" cy="30" r="29" fill="#a8cbd7"/>
      <text x="363" y="39" text-anchor="middle" fill="#101922" font-size="26">+1</text>
    </g>
  </g>
</svg>
